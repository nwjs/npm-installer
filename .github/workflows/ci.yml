name: ci

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os:
        - macos-26
        - ubuntu-24.04
        - windows-2025
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Get Node version from NW.js versions manifest
        run: echo "NODE_VER=$(curl -s https://nwjs.io/versions.json | jq -r ".versions[0].components.node")" >> $GITHUB_ENV
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VER }}
          cache: "npm"
      - name: Install third party dependencies
        run: npm ci --nwjs-build-type=sdk
      - name: Check for third party vulnerabilities
        run: npm audit
      - name: Run test suite
        run: npm run test:coverage
      - name: Report Coverage
        if: always()
        uses:  davelosert/vitest-coverage-report-action@v2.12.2

  version-bump:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Get latest NW.js version
        id: nwjs
        run: |
          latest=$(curl -s https://nwjs.io/versions.json | jq -r ".latest" | sed "s/^v//")
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Get current package version
        id: pkg
        run: echo "current=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          latest="${{ steps.nwjs.outputs.latest }}"
          current="${{ steps.pkg.outputs.current }}"
          higher=$(printf "%s\n%s\n" "$current" "$latest" | sort -V | tail -n1)
          if [ "$latest" != "$current" ] && [ "$higher" = "$latest" ]; then
            echo "update=true" >> $GITHUB_OUTPUT
          else
            echo "update=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        if: steps.compare.outputs.update == 'true'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Bump version in package.json
        if: steps.compare.outputs.update == 'true'
        run: npm version ${{ steps.nwjs.outputs.latest }} --no-git-tag-version --allow-same-version

      - name: Update package-lock.json
        if: steps.compare.outputs.update == 'true'
        run: npm install --ignore-scripts

      - name: Commit, push and open PR
        if: steps.compare.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.nwjs.outputs.latest }}
          CURRENT: ${{ steps.pkg.outputs.current }}
        run: |
          branch="nwjs-version-bump/${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add package.json package-lock.json
          git commit -m "${VERSION}"
          git push --force origin "$branch"

          if gh pr list --head "$branch" --state open --json number --jq ".[0].number" | grep -q .; then
            echo "PR already open for $branch, skipping creation"
          else
            gh pr create \
              --title "chore: bump version to ${VERSION}" \
              --body "NW.js released [\`v${VERSION}\`](https://nwjs.io/versions.json), which is newer than the current package version (\`${CURRENT}\`).

          This PR bumps \`package.json\` to \`${VERSION}\` and updates \`package-lock.json\` accordingly.

          Opened automatically by the \`ci\` workflow." \
              --base main \
              --head "$branch"
          fi
